<app-main-photo heroKey="hero.aboutUs">
    <app-action-button buttonKey="actionButton.contact" mailMode="contact"/>
    <app-navigation-button
        buttonKey="actionButton.goToContact"
        route="/contact"
    />
  </app-main-photo>

<app-clinic-identity />

  <app-section-title titleKey="team.sectionTitle" />
  <app-cards-carousel
    [columnsMobile]="teamArray.length > 2 ? 2 : teamArray.length"
    [columnsTablet]="teamArray.length > 3 ? 3 : teamArray.length"
    [columnsDesktop]="teamArray.length > 5 ? 5 : teamArray.length"
  >
      @for (card of teamArray; track card.title || $index) {
        <app-professional-card [card]="card" />
      }
    </app-cards-carousel>

<app-cards-carousel
  [columnsMobile]="teamArray.length > 1 ? 1.3 : teamArray.length"
  [columnsTablet]="teamArray.length > 3 ? 1.5 : teamArray.length"
  [columnsDesktop]="teamArray.length > 4 ? 4 : teamArray.length"
>
  @for (card of metricsArray; track card.title || $index) {
    <app-metric-card [card]="card" />
  }
</app-cards-carousel>
