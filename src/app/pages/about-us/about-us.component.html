<app-main-photo heroKey="hero.aboutUs">
    <app-action-button buttonKey="actionButton.contact" mailMode="contact"/>
    <app-navigation-button
        buttonKey="actionButton.goToContact"
        route="/contact"
    />
  </app-main-photo>

<app-clinic-identity />

  <app-section-title titleKey="team.sectionTitle" />
  <app-cards-carousel
    [columnsMobile]="teamArray.length < 1.5 ? 1.05 : 1.3"
    [columnsTablet]="teamArray.length < 1.5 ? 1 : 2.3"
    [columnsDesktop]="teamArray.length < 5.5 ? (teamArray.length + 0.2) : 5.5"
  >
      @for (card of teamArray; track card.title || $index) {
        <app-professional-card [card]="card" />
      }
    </app-cards-carousel>

<app-cards-carousel
  [columnsMobile]="metricsArray.length < 1.5 ? 1.18 : 1.3"
  [columnsTablet]="metricsArray.length < 2.5 ? 2.2 : 2.3"
  [columnsDesktop]="metricsArray.length < 3 ? teamArray.length : 3.2"
>
  @for (card of metricsArray; track card.title || $index) {
    <app-metric-card [card]="card" />
  }
</app-cards-carousel>
