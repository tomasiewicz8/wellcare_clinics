<section
  class="contact-cta"
  aria-labelledby="contact-cta-title"
>
  <div class="contact-cta__content">
    <h2
      id="contact-cta-title"
      class="contact-cta__title"
    >
      {{ translationService.translate('contactCta.title') }}
    </h2>

    <p class="contact-cta__text">
      {{ translationService.translate('contactCta.text') }}
    </p>

    <app-action-button
      class="contact-cta__action"
      buttonKey="actionButton.contact"
      mailMode="contact"
    />
  </div>
</section>
