<article
  class="help-card"
  [class.help-card--compact]="variant === 'compact'"
  [class.help-card--banner]="variant === 'banner'"
>
    <div class="help-card__header">
      <img
        class="help-card__icon"
        src="assets/images/search.png"
        alt=""
      >
  
      <h2 class="help-card__title">
        {{ translationService.translate('actionButton.helpCard') }}
      </h2>
    </div>

    <app-action-button class="help-card__action" buttonKey="actionButton.contact" mailMode="contact"/>
  </article>
