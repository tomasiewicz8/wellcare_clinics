<app-navbar />

<main class="app-main">
  <router-outlet />
</main>

<app-footer />

<app-modal
  [isOpen]="modalService.isOpen()"
  (modalClose)="modalService.close()"
>
  @switch (modalService.contentType()) {
    @case ('menu') {
      <app-menu-modal-content />
    }

    @case ('article') {
      <app-article-modal-content
        [article]="modalService.contentData()"
      />
    }
  }
</app-modal>
